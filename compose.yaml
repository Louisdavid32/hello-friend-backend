name: hello-friend-backend

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: hello_friend
      POSTGRES_USER: hello_friend_owner
      POSTGRES_PASSWORD: hello_friend_local_only
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=500
      - -c
      - idle_in_transaction_session_timeout=10s
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hello_friend_owner -d hello_friend]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:8.2.9-bookworm
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "yes"
    ports:
      - 127.0.0.1:6379:6379
    tmpfs:
      - /data:size=268435456,mode=0700
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    read_only: true
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  postgres-data:
